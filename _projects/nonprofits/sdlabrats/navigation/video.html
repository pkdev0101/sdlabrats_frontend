{%- comment -%} YouTube video in a 16:9 frame (privacy-enhanced domain). Params: id, title. {%- endcomment -%}
<div class="labrats__embed">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}" title="{{ include.title | escape }}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>
