{%- assign notice = site.data.sdlabrats.announcement -%}
{%- if notice.show and page.url != notice.url -%}
<aside class="labrats__announcement" aria-label="Announcement" data-labrats-announcement="{{ notice.id }}">
  <div class="labrats__wrap labrats__announcement-row">
    <p>{{ notice.text }} <a href="{{ notice.url | relative_url }}">{{ notice.link_text }}</a></p>
    <button type="button" class="labrats__announcement-close" data-labrats-dismiss>
      <span class="labrats__visually-hidden">Dismiss announcement</span>
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
</aside>
<script>try{if(localStorage.getItem("labrats-dismissed-{{ notice.id }}"))document.querySelector("[data-labrats-announcement]").hidden=true}catch(e){}</script>
{%- endif -%}
